services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TOKENS_FILE: /app/instance/bot_user_tokens.json
    volumes:
      - bot_data:/app/instance

  # Optional legacy SQLite admin; start with --profile admin.
  app:
    profiles: [admin]
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DEBUG: "False"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - bot_data:/app/instance
    command: python app.py

volumes:
  bot_data:
